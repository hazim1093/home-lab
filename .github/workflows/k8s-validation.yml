name: Kubernetes Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'kubernetes/components/**'
  push:
    branches:
      - main
    paths:
      - 'kubernetes/components/**'

# A called workflow can only use scopes the caller declares; without this the
# nested job is left with none and the run fails at startup.
permissions:
  contents: read

jobs:
  validate:
    uses: hazim1093/ci/.github/workflows/k8s-validation.yml@main
    with:
      roots: kubernetes/components
