name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Comment on PR with secrets found
        if: steps.gitleaks.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let reportContent = '';

            // Try to read the gitleaks report
            try {
              if (fs.existsSync('results.sarif')) {
                const sarif = JSON.parse(fs.readFileSync('results.sarif', 'utf8'));
                const results = sarif.runs[0]?.results || [];

                if (results.length > 0) {
                  reportContent = '## 🚨 Secrets Detected\n\n';
                  reportContent += `Found ${results.length} potential secret(s) in this PR:\n\n`;

                  results.forEach((result, index) => {
                    const location = result.locations[0]?.physicalLocation;
                    const file = location?.artifactLocation?.uri || 'unknown';
                    const line = location?.region?.startLine || 'unknown';
                    const ruleId = result.ruleId || 'unknown';
                    const message = result.message?.text || 'Secret detected';

                    reportContent += `### ${index + 1}. ${ruleId}\n`;
                    reportContent += `- **File**: \`${file}\`\n`;
                    reportContent += `- **Line**: ${line}\n`;
                    reportContent += `- **Details**: ${message}\n\n`;
                  });

                  reportContent += '\n⚠️ Please remove these secrets before merging.';
                }
              } else {
                reportContent = '## 🚨 Secrets Detected\n\nGitleaks found potential secrets in your code. Check the workflow logs for details.';
              }
            } catch (error) {
              reportContent = '## 🚨 Secrets Detected\n\nGitleaks found potential secrets in your code. Check the workflow logs for details.\n\nError reading report: ' + error.message;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reportContent
            });

      - name: Fail PR on secret detection
        if: steps.gitleaks.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::error::Secrets detected in commit! Please remove them before merging."
          exit 1

      - name: Alert on main branch
        if: steps.gitleaks.outcome == 'failure' && github.ref == 'refs/heads/main'
        run: |
          echo "::warning::Secrets detected in main branch commit!"
          exit 0
