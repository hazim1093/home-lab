name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Fail PR on secret detection
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo "::error::Secrets detected in commit! Please remove them before merging."
          exit 1

      - name: Alert on main branch
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          echo "::warning::Secrets detected in main branch commit!"
          exit 0
