  namespace: grafana-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folder: Kubernetes
  grafanaCom:
    id: 15758
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-views-nodes
  namespace: grafana-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folder: Kubernetes
  grafanaCom:
    id: 15759
---
apiVersion: grafana.integreatly.org/v1beta1
