apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha-mcp
  namespace: ha-mcp
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      url: "http://ha-mcp.ha-mcp.svc.cluster.local:8086/healthz"
      interval: 60s
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - "mcp.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: ha-mcp
      port: 8086
