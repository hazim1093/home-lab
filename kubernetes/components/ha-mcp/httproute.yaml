apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha-mcp
  namespace: ha-mcp
  annotations:
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - "ha-mcp.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: ha-mcp
      port: 8086
