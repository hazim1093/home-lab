apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ha-mcp-restrict-ingress
  namespace: ha-mcp
spec:
  podSelector:
    matchLabels:
      app: ha-mcp
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Only the hermes pod (MCP client) may reach the server; it has full
    # control over Home Assistant
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes
