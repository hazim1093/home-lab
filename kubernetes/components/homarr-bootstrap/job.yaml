apiVersion: batch/v1
kind: Job
metadata:
  # Versioned on purpose: a Job's pod template is immutable, so any change to the script
  # below needs a new name or Flux cannot apply it (the old Job is pruned).
  name: homarr-admin-bootstrap-v2
  namespace: homarr
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homarr-admin-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          # Same image/tag as the dashboard in ../homarr: the CLI ships inside it.
          image: ghcr.io/homarr-labs/homarr:v1.77.0
          command:
            - /bin/sh
            - -c
            - |
              set -u
              # `timeout` guards against a CLI that hangs instead of exiting, which would
              # otherwise leave the Job running until activeDeadlineSeconds.
              T=""
              command -v timeout >/dev/null 2>&1 && T="timeout 30"

              # The dashboard creates and migrates the database on startup, so wait for it.
              attempt=0
              while true; do
                out=$(${T} homarr users list </dev/null 2>&1) && break
                attempt=$((attempt + 1))
                if [ "${attempt}" -ge 6 ]; then
                  echo "The CLI could not read the Homarr database after 90s:"
                  echo "${out}"
                  exit 1
                fi
                sleep 15
              done

              if [ -z "${ADMIN_USERNAME:-}" ] || [ "${ADMIN_PASSWORD:-}" = "CHANGEME" ]; then
                echo "admin-username/admin-password are still placeholders in homarr-secrets; nothing to apply."
                exit 0
              fi

              # Creates a credentials admin only if none exists; otherwise prints and returns.
              ${T} homarr recreate-admin -u "${ADMIN_USERNAME}" </dev/null || true

              attempt=0
              while true; do
                attempt=$((attempt + 1))
                if ${T} homarr users update-password -u "${ADMIN_USERNAME}" -p "${ADMIN_PASSWORD}" </dev/null; then
                  echo "applied the login for '${ADMIN_USERNAME}'"
                  exit 0
                fi
                if [ "${attempt}" -ge 3 ]; then
                  echo "Could not set the password after ${attempt} attempts (see the CLI output above)."
                  exit 1
                fi
                sleep 5
              done
          env:
            - name: AUTH_PROVIDERS
              value: "credentials"
            - name: DB_DRIVER
              value: "better-sqlite3"
            - name: DB_DIALECT
              value: "sqlite"
            - name: DB_URL
              value: "/appdata/db.sqlite"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: db-encryption-key
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: admin-password
          volumeMounts:
            - name: homarr-database
              mountPath: /appdata
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: homarr-database
          persistentVolumeClaim:
            claimName: homarr-database
