apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mosquitto
data:
  mosquitto.conf: |
    # Mosquitto MQTT Broker Configuration

    # Persistence
    persistence true
    persistence_location /mosquitto/data/

    # Logging
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information

    # Listener for MQTT connections
    listener 1883

    # Allow anonymous connections (for home lab use)
    # For production, configure authentication
    allow_anonymous true

    # Connection settings
    max_connections -1

    # Keep alive settings
    max_keepalive 65535
