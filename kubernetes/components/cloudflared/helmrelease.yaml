apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 12h
  chart:
    spec:
      chart: cloudflare-tunnel
      version: "0.3.2"
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: flux-system
      interval: 12h
  values:
    cloudflare:
      tunnelName: home-lab
      # Not cloudflare.secret: that renders credentials into these public values.
      secretName: cloudflared-credentials
      enableWarp: false
      ingress: []
    image:
      # Chart appVersion (2024.8.3) lags.
      tag: "2026.10.7"
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
