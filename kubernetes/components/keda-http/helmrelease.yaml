apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-http
  namespace: keda-http
spec:
  interval: 12h
  upgrade:
    remediation:
      retries: 5
  values:
    # Chart defaults request 250m per pod - seven pods, 1.75 cores of a 4-core
    # node, for pods that use ~15m. Set through the chart's own values.
    operator:
      resources:
        requests:
          cpu: 25m
    scaler:
      resources:
        requests:
          cpu: 25m
    interceptor:
      resources:
        requests:
          cpu: 25m
  chart:
    spec:
      chart: keda-add-ons-http
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
      interval: 12h
