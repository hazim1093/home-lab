# PLACEHOLDER - NOT ENCRYPTED YET.
#
# This file must be SOPS-encrypted with real Grafana Cloud credentials before
# Flux can apply it (the grafana-alloy Kustomization requires sops decryption,
# see flux-system/apps/grafana-alloy.yaml). Until then, reconciliation of this
# component will fail.
#
# 1. Create a Grafana Cloud Access Policy Token with `metrics:write` and
#    `logs:write` scopes:
#    Grafana Cloud portal -> Administration -> Access Policies -> Create access policy
# 2. Replace the placeholder value below with the real token.
# 3. Encrypt in place:
#      export SOPS_AGE_KEY_FILE=.age/key.txt
#      sops --encrypt --in-place kubernetes/components/grafana-alloy/grafana-cloud-secret.yaml
# 4. Commit only the encrypted result.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-credentials
  namespace: grafana-alloy
type: Opaque
stringData:
  api-key: "REPLACE_WITH_GRAFANA_CLOUD_ACCESS_POLICY_TOKEN"
