# Ships cluster metrics + pod logs to a Grafana Cloud free-tier stack.
#
# Before this reconciles successfully:
#   1. Fill in grafana-cloud-config.yaml with the URLs and usernames from your
#      Grafana Cloud stack details page (Send Metrics / Send Logs).
#      These are not secret (just endpoint/instance IDs).
#   2. Fill in and SOPS-encrypt grafana-cloud-secret.yaml with a real API token
#      (see comments in that file).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-alloy
  namespace: grafana-alloy
spec:
  interval: 12h
  chart:
    spec:
      chart: alloy
      version: "0.12.6"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  values:
    alloy:
      extraEnv:
        - name: GRAFANA_CLOUD_API_KEY
          valueFrom:
            secretKeyRef:
              name: grafana-cloud-credentials
              key: api-key
              optional: false
        - name: GRAFANA_CLOUD_PROMETHEUS_URL
          valueFrom:
            secretKeyRef:
              name: grafana-cloud-credentials
              key: prometheus-url
        - name: GRAFANA_CLOUD_PROMETHEUS_USERNAME
          valueFrom:
            secretKeyRef:
              name: grafana-cloud-credentials
              key: prometheus-username
        - name: GRAFANA_CLOUD_LOKI_URL
          valueFrom:
            secretKeyRef:
              name: grafana-cloud-credentials
              key: loki-url
        - name: GRAFANA_CLOUD_LOKI_USERNAME
          valueFrom:
            secretKeyRef:
              name: grafana-cloud-credentials
              key: loki-username

      configMap:
        create: true
        content: |
          // ---- Metrics: scrape kubelet/cAdvisor on every node ----
          discovery.kubernetes "nodes" {
            role = "node"
          }

          prometheus.scrape "kubelet_cadvisor" {
            targets              = discovery.kubernetes.nodes.targets
            scheme               = "https"
            bearer_token_file    = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            metrics_path         = "/metrics/cadvisor"
            job_name             = "integrations/kubernetes/cadvisor"
            scrape_interval      = "60s"

            tls_config {
              insecure_skip_verify = true
            }

            forward_to = [prometheus.remote_write.grafana_cloud.receiver]
          }

          prometheus.scrape "kubelet" {
            targets              = discovery.kubernetes.nodes.targets
            scheme               = "https"
            bearer_token_file    = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            metrics_path         = "/metrics"
            job_name             = "integrations/kubernetes/kubelet"
            scrape_interval      = "60s"

            tls_config {
              insecure_skip_verify = true
            }

            forward_to = [prometheus.remote_write.grafana_cloud.receiver]
          }

          prometheus.remote_write "grafana_cloud" {
            endpoint {
              url = env("GRAFANA_CLOUD_PROMETHEUS_URL")

              basic_auth {
                username = env("GRAFANA_CLOUD_PROMETHEUS_USERNAME")
                password = env("GRAFANA_CLOUD_API_KEY")
              }
            }
          }

          // ---- Logs: tail every pod's logs via the Kubernetes API ----
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.grafana_cloud.receiver]
          }

          loki.write "grafana_cloud" {
            endpoint {
              url = env("GRAFANA_CLOUD_LOKI_URL")

              basic_auth {
                username = env("GRAFANA_CLOUD_LOKI_USERNAME")
                password = env("GRAFANA_CLOUD_API_KEY")
              }
            }
          }

    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
