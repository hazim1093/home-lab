# Deployed via bjw-s/app-template (https://github.com/bjw-s-labs/helm-charts) — the
# generic "common library" chart used across the home-operations/homelab community
# instead of a paperless-specific chart (none is officially maintained). Two
# controllers: paperless-ngx itself and a dedicated Valkey broker. The HTTPRoute,
# NetworkPolicy and backup CronJob stay as plain manifests alongside this release —
# see httproute.yaml / networkpolicy.yaml / backup-cronjob.yaml in this directory.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: paperless
spec:
  interval: 12h
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: "5.2.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 12h
  values:
    controllers:
      paperless:
        type: deployment
        replicas: 1
        # SQLite + RWO volumes: no rolling update, only one writer at a time.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Avoid PAPERLESS_* env vars injected for the "paperless" Service
          # (e.g. PAPERLESS_PORT) shadowing the app's own PAPERLESS_* config vars.
          enableServiceLinks: false
        initContainers:
          # Fetches Swedish tessdata onto the data PVC once, instead of relying on
          # PAPERLESS_OCR_LANGUAGES (which would apt-get install it on every
          # container start — slow, and fails without network at boot).
          fetch-tessdata:
            image:
              repository: busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - |
                set -eu
                DEST=/usr/src/paperless/data/tessdata/swe.traineddata
                if [ -s "$DEST" ]; then
                  echo "swe.traineddata already present"
                  exit 0
                fi
                mkdir -p /usr/src/paperless/data/tessdata
                echo "downloading swe.traineddata..."
                wget -qO "$DEST.tmp" \
                  https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/swe.traineddata
                mv "$DEST.tmp" "$DEST"
                echo "swe.traineddata installed"
          # Fails loudly (instead of silently OCR-ing English-only) if the pinned
          # image's tessdata directory ever moves from the Debian-standard path
          # assumed below. If this ever fails after a version bump, find the real
          # path with `tesseract --list-langs` / `find / -name eng.traineddata`
          # inside the image and update both this check and the persistence mount
          # below (persistence.data.advancedMounts).
          verify-tessdata-path:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: "3.2.1"
            command:
              - sh
              - -c
              - |
                set -eu
                if [ ! -f /usr/share/tesseract-ocr/5/tessdata/eng.traineddata ]; then
                  echo "ERROR: expected tessdata dir /usr/share/tesseract-ocr/5/tessdata not found in this image." >&2
                  echo "Update the tessdata persistence mount in helmrelease.yaml." >&2
                  exit 1
                fi
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: "3.2.1"
              pullPolicy: IfNotPresent
            envFrom:
              - configMapRef:
                  name: paperless-config
              - secretRef:
                  name: paperless-secrets
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8000
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8000
                  initialDelaySeconds: 90
                  periodSeconds: 30
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
      paperless-redis:
        type: deployment
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: "9.1.2-alpine"
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  initialDelaySeconds: 2
                  periodSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    configMaps:
      paperless-config:
        data:
          PAPERLESS_REDIS: "redis://paperless-redis.paperless.svc.cluster.local:6379"
          PAPERLESS_DBENGINE: "sqlite"
          # Needed for CSRF/allowed-hosts checks to pass behind Traefik.
          PAPERLESS_URL: "https://paperless.${LOCAL_DOMAIN}"
          PAPERLESS_TIME_ZONE: "Europe/Stockholm"
          # eng is bundled in the image; swe is fetched onto the data PVC by the
          # fetch-tessdata init container above — do not set
          # PAPERLESS_OCR_LANGUAGES here, that would apt-get install it on every
          # start.
          PAPERLESS_OCR_LANGUAGE: "eng+swe"
          # inotify is unreliable on some volume backends; poll instead.
          PAPERLESS_CONSUMER_POLLING: "60"

    service:
      paperless:
        controller: paperless
        ports:
          http:
            port: 8000
      paperless-redis:
        controller: paperless-redis
        ports:
          valkey:
            port: 6379

    # advancedMounts is used exclusively (no globalMounts) everywhere below, so
    # each volume is only ever attached where explicitly listed — in particular,
    # none of these are mounted into the paperless-redis controller.
    persistence:
      # SQLite DB, search index, classifier model, and the on-disk Swedish
      # tessdata file fetched by fetch-tessdata above.
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: local-path
        advancedMounts:
          paperless:
            fetch-tessdata:
              - path: /usr/src/paperless/data
            app:
              - path: /usr/src/paperless/data
              # Single-file mount: only swe.traineddata is overlaid, the bundled
              # eng/osd data that ships in the image stays in place.
              - path: /usr/share/tesseract-ocr/5/tessdata/swe.traineddata
                subPath: tessdata/swe.traineddata
      # The actual documents (originals + generated archive PDFs + thumbnails).
      # This is the volume that matters most for the backup.
      media:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 30Gi
        storageClass: local-path
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/media
      # Drop-folder for new documents. Kept small — files are moved out (into
      # media) once consumed.
      consume:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: local-path
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/consume
