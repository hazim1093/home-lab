apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# Root CA (self-signed)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: internal-ca
  secretName: internal-ca-secret
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# ClusterIssuer for root CA (used to sign intermediate)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-root-ca-issuer
spec:
  ca:
    secretName: internal-ca-secret
---
# Intermediate CA (signed by root CA) - includes full chain
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-intermediate-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: internal-intermediate-ca
  secretName: internal-intermediate-ca-secret
  duration: 43800h # 5 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: internal-root-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# ClusterIssuer using intermediate CA (will include full chain in issued certs)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca-issuer
spec:
  ca:
    secretName: internal-intermediate-ca-secret
