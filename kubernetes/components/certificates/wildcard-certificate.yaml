apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard-cert
  namespace: traefik
spec:
  secretName: internal-wildcard-cert
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  dnsNames:
  - "*.lab"
  - "lab"
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
