apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 12h
  # A slow rollout should not leave the release Stalled after one attempt.
  upgrade:
    remediation:
      retries: 3
  # The frr-k8s statuscleaner binds hostPort 19443, so a rolling update can never
  # place the new pod while the old one holds the port. Recreate frees it first.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: metallb-frr-k8s-statuscleaner
              namespace: metallb-system
            patch: |-
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
  chart:
    spec:
      chart: metallb
      version: "0.16.2"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 12h
