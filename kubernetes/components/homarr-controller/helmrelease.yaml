apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr-controller
  namespace: homarr
spec:
  interval: 12h
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: homarr-kubernetes-dashboard-controller
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: homarr-controller
        namespace: flux-system
  install:
    timeout: 5m
  # The chart has no podAnnotations value, so the reloader hint is patched onto the
  # Deployment: rotating the API key in homarr-secrets then rolls this pod by itself.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |-
              - op: add
                path: /spec/template/metadata/annotations
                value: {}
              - op: add
                path: /spec/template/metadata/annotations/reloader.stakater.com~1auto
                value: "true"
  values:
    # Gateway API only: this lab has no Ingress/IngressRoute objects.
    sources:
      - gateway-httproute
    homarr:
      url: http://homarr.homarr.svc.cluster.local:7575
      apiKeySecret:
        name: homarr-secrets
        key: api-key
    # Board is created on first sync if missing; set this to an existing board name to take one over.
    board:
      name: home-lab
      columnCount: 12
    annotationPrefix: homarr.dev
    # The controller appends ".svg" to a bare icon slug, so this must be the svg directory.
    defaultIconBaseURL: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg
    namespaces:
      allNamespaces: true
      ignore:
        - kube-system
        - flux-system
    reconcileInterval: 5m
    leaderElect: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
