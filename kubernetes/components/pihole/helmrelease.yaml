apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  interval: 12h
  chart:
    spec:
      chart: pihole
      version: "2.35.0"
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
      interval: 12h
  values:
    replicaCount: 1
    resources:
      requests:
        memory: 64Mi
        cpu: 50m

    adlists:
    # StevenBlack's Unified Hosts (ads + malware)
    - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    # OISD - comprehensive blocklist (domains format for PiHole)
    - https://big.oisd.nl/domainswild
    # Hagezi Multi Pro
    - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt
    # Hagezi NSFW
    - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/adblock/nsfw.txt
    # Hagezi Gambling
    - https://gitlab.com/hagezi/mirror/-/raw/main/dns-blocklists/adblock/gambling.txt
    # Firebog - Suspicious
    - https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt
    - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Spam/hosts
    # Firebog - Advertising
    - https://v.firebog.net/hosts/AdguardDNS.txt
    - https://v.firebog.net/hosts/Admiral.txt
    # Firebog - Tracking & Telemetry
    - https://v.firebog.net/hosts/Easyprivacy.txt
    - https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
    # Firebog - Malicious
    - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt
    - https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt

    persistentVolumeClaim:
      enabled: true
      size: 1Gi
    serviceDns:
      type: LoadBalancer
      loadBalancerIP: "192.168.0.201"
      annotations:
        metallb.universe.tf/allow-shared-ip: "pihole-dns"
    serviceWeb:
      type: ClusterIP
      sessionAffinity: ClientIP
      sessionAffinityConfig:
        clientIP:
          timeoutSeconds: 10800
    DNS1: "127.0.0.1#5335" # unbound
    DNS2: "127.0.0.1#5335"
    extraEnvVars:
      FTLCONF_database_DBInterval: "60.0"  # Increase from 3 to 60 minutes (reduce DB writes)
      FTLCONF_database_DBImport: "yes"  # Enable database import
      FTLCONF_database_DBExport: "yes"  # Enable database export
      FTLCONF_rate_limit_count: "2000"  # Increase from 1000 to 2000 queries/60s
      FTLCONF_rate_limit_interval: "60"  # Time window in seconds
    dnsmasq:
      # DNS entries for ${LOCAL_DOMAIN} are managed automatically by external-dns
      # Only add manual entries here for services not exposed via HTTPRoute
      customDnsEntries:
      - address=/rustdesk.lab/192.168.0.203
      - address=/mqtt.lab/192.168.0.202
      # Bosch dishwasher Home Connect Local: integration connects to its profile hostname
      - address=/bosch-dishwasher-012060522931003141/192.168.0.84

    # unbound
    extraVolumes:
      unbound-config:
        configMap:
          name: unbound-config
    extraContainers:
    - name: unbound
      image: mvance/unbound:1.22.0
      ports:
      - containerPort: 5335
        protocol: UDP
      - containerPort: 5335
        protocol: TCP
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
      volumeMounts:
      - name: unbound-config
        mountPath: /opt/unbound/etc/unbound/unbound.conf
        subPath: unbound.conf
