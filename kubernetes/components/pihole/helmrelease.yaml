apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  interval: 12h
  chart:
    spec:
      chart: pihole
      version: "2.34.0"
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
      interval: 12h
  values:
    persistentVolumeClaim:
      enabled: true
      size: 1Gi
    serviceDns:
      type: LoadBalancer
    serviceWeb:
      type: ClusterIP
    DNS1: "unbound.unbound.svc.cluster.local"
    DNS2: "unbound.unbound.svc.cluster.local"
    extraVolumes:
    - name: custom-dnsmasq
      configMap:
        name: pihole-custom-dnsmasq
    extraVolumeMounts:
    - name: custom-dnsmasq
      mountPath: /etc/dnsmasq.d/02-custom.conf
      subPath: 02-custom.conf
