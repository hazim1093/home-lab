apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: pihole
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      url: "http://pihole-web.pihole.svc.cluster.local/admin"
      interval: 60s
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "pihole.lab"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: pihole-web
      port: 80
    sessionPersistence:
      sessionName: pihole-session
      cookieLifetimeSeconds: 3600
      cookieConfig:
        lifetimeType: Session
