apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homarr-controller
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/components/homarr-controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: homarr
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: homarr-controller
      namespace: homarr
  timeout: 5m
  wait: true
