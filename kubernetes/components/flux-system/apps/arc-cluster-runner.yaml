apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-cluster-runner
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: arc-controller
  path: ./kubernetes/components/arc-cluster-runner
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
