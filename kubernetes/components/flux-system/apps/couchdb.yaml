apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: couchdb
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/couchdb
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  dependsOn:
  - name: tailscale-operator
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: couchdb
    namespace: couchdb
  decryption:
    provider: sops
    secretRef:
      name: sops-age
