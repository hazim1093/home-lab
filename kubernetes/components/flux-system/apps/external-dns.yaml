apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/components/external-dns
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: external-dns
    namespace: external-dns
  postBuild:
    substituteFrom:
    - kind: Secret
      name: domain-config
  decryption:
    provider: sops
    secretRef:
      name: sops-age
