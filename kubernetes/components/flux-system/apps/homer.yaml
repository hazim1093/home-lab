apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homer
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/components/homer
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Dashboard CR needs the homer.rajsingh.info CRD the operator installs.
  dependsOn:
  - name: homer-operator
  postBuild:
    substituteFrom:
    - kind: Secret
      name: domain-config
