apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/components/cloudflared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: cloudflared
    namespace: cloudflared
  postBuild:
    substituteFrom:
    - kind: Secret
      name: domain-config
  decryption:
    provider: sops
    secretRef:
      name: sops-age
