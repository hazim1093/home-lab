apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
spec:
  dependsOn:
  - name: cert-manager
  interval: 10m
  path: ./kubernetes/components/certificates
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
    - kind: Secret
      name: domain-config
  decryption:
    provider: sops
    secretRef:
      name: sops-age
