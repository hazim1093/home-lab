apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-alloy
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/components/grafana-alloy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: grafana-alloy
    namespace: grafana-alloy
  decryption:
    provider: sops
    secretRef:
      name: sops-age
