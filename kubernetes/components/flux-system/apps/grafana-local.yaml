apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-local
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/components/grafana-local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
    - kind: Secret
      name: domain-config
  dependsOn:
  - name: grafana-operator
  - name: traefik
