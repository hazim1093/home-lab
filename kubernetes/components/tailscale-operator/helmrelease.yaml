apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 12h
  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 12h
  values:
    # OAuth credentials come from the pre-created SOPS secret `operator-oauth`
    # in this namespace. Leaving oauth.* empty is the chart's documented path
    # for that; setting them here would store them in a plaintext ConfigMap.
    oauth:
      clientId: ""
      clientSecret: ""
    installCRDs: true
    operatorConfig:
      defaultTags:
        - "tag:k8s-operator"
      resources:
        requests:
          memory: 64Mi
          cpu: 25m
        limits:
          memory: 256Mi
