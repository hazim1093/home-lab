apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 12h
  chart:
    spec:
      chart: external-dns
      version: "1.15.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 12h
  values:
    # Use Pi-hole as DNS provider
    provider: pihole

    # Pi-hole configuration
    extraArgs:
    - --pihole-server=http://pihole-web.pihole.svc.cluster.local
    - --pihole-password=$(PIHOLE_PASSWORD)
    - --pihole-tls-skip-verify

    env:
    - name: PIHOLE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pihole-password
          key: password
          optional: false

    # Watch HTTPRoutes
    sources:
    - gateway-httproute

    # Domain filter - only manage .lab domains
    domainFilters:
    - lab

    # Registry: noop (Pi-hole doesn't support TXT records)
    registry: noop

    # Policy: upsert-only (don't delete manual entries)
    policy: upsert-only

    # Logging
    logLevel: debug
