apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 12h
  chart:
    spec:
      chart: external-dns
      version: "1.19.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 12h
  values:
    # Use Cloudflare as DNS provider for public DNS
    provider:
      name: cloudflare

    # Cloudflare configuration
    env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: api-token
          optional: false

    # Watch HTTPRoutes
    sources:
    - gateway-httproute

    # Domain filter - manage ${LOCAL_DOMAIN} subdomain
    domainFilters:
    - ${LOCAL_DOMAIN}

    # Use TXT records for ownership tracking
    registry: txt
    txtOwnerId: home-lab
    txtPrefix: externaldns-

    # Policy: sync (create and delete records)
    policy: sync

    # Logging
    logLevel: info
