apiVersion: v1
kind: ConfigMap
metadata:
  name: homarr-httproute-sync
  namespace: homarr
  labels:
    app.kubernetes.io/name: homarr-httproute-sync
data:
  sync.py: |
    #!/usr/bin/env python3
    """Sync annotated HTTPRoutes onto a Homarr board.

    Every HTTPRoute carrying `<prefix>/enabled: "true"` becomes a Homarr app plus a board tile, filed in
    the container named by `<prefix>/category` when such a container exists. Existing tiles are never moved
    inside their container; only items this script created (`managed-<appId>`) are touched.

    Environment:
      HOMARR_URL          Homarr base URL (default http://homarr.homarr.svc.cluster.local:7575)
      HOMARR_API_KEY      Homarr API key, sent as the ApiKey header (required)
      BOARD_NAME          board to manage (default home-lab)
      DRY_RUN             "true" logs the plan and writes nothing
      PLACE_ITEMS         "false" keeps the board untouched (apps only)
      ENFORCE_CATEGORY    "true" (default) moves a managed tile to the container its category names
      PRUNE               "true" deletes managed tiles whose route is gone or un-annotated (default false:
                          they are only reported, so a typo in an annotation cannot wipe the board)
      ROUTES_FILE         read a HTTPRouteList JSON from this path instead of the Kubernetes API
      ANNOTATION_PREFIX   annotation prefix (default homarr.dev)
      ICON_BASE_URL       base URL for slug icons (default homarr-labs/dashboard-icons/svg)
    """

    import json
    import os
    import ssl
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    HOMARR_URL = os.environ.get("HOMARR_URL", "http://homarr.homarr.svc.cluster.local:7575").rstrip("/")
    API_KEY = os.environ.get("HOMARR_API_KEY", "")
    BOARD_NAME = os.environ.get("BOARD_NAME", "home-lab")
    DRY_RUN = os.environ.get("DRY_RUN", "false").lower() == "true"
    PLACE_ITEMS = os.environ.get("PLACE_ITEMS", "true").lower() == "true"
    ENFORCE_CATEGORY = os.environ.get("ENFORCE_CATEGORY", "true").lower() == "true"
    PRUNE = os.environ.get("PRUNE", "false").lower() == "true"
    ROUTES_FILE = os.environ.get("ROUTES_FILE", "")
    PREFIX = os.environ.get("ANNOTATION_PREFIX", "homarr.dev")
    ICON_BASE_URL = os.environ.get("ICON_BASE_URL", "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg")

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    MANAGED_PREFIX = "managed-"


    def log(msg):
        print(msg, flush=True)


    def die(msg):
        log("ERROR: " + msg)
        sys.exit(1)


    # ---------------------------------------------------------------- Kubernetes

    def k8s_routes():
        """List HTTPRoutes cluster-wide with the pod's service account."""
        host = os.environ.get("KUBERNETES_SERVICE_HOST")
        port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
        if not host:
            die("no ROUTES_FILE and not running in Kubernetes (KUBERNETES_SERVICE_HOST unset)")

        with open(f"{SA_DIR}/token") as fh:
            token = fh.read().strip()
        ssl_ctx = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")
        url = f"https://{host}:{port}/apis/gateway.networking.k8s.io/v1/httproutes"
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
        try:
            with urllib.request.urlopen(req, timeout=30, context=ssl_ctx) as resp:
                return json.load(resp).get("items", [])
        except urllib.error.HTTPError as exc:
            die(f"listing HTTPRoutes failed: {exc.code} {exc.read()[:200]!r}")
        except Exception as exc:  # noqa: BLE001
            die(f"listing HTTPRoutes failed: {exc}")


    def load_routes():
        if ROUTES_FILE:
            with open(ROUTES_FILE) as fh:
                data = json.load(fh)
            log(f"routes: read from {ROUTES_FILE}")
            return data.get("items", data if isinstance(data, list) else [])
        return k8s_routes()


    def parse_route(route):
        """Return the desired state for a route, or None when it is not managed."""
        meta = route.get("metadata", {})
        ann = meta.get("annotations") or {}
        if ann.get(f"{PREFIX}/enabled", "").lower() != "true":
            return None
        name = ann.get(f"{PREFIX}/name")
        url = ann.get(f"{PREFIX}/url")
        if not name or not url:
            log(f"WARN: {meta.get('namespace')}/{meta.get('name')} is enabled but misses name/url — skipped")
            return None
        icon = ann.get(f"{PREFIX}/icon", "")
        return {
            "id": f"{meta.get('namespace')}/{meta.get('name')}",
            "name": name,
            "href": url,
            "iconUrl": icon if icon.startswith("http") else f"{ICON_BASE_URL}/{icon}.svg",
            "description": ann.get(f"{PREFIX}/description"),
            "pingUrl": ann.get(f"{PREFIX}/ping-url") or None,
            "category": ann.get(f"{PREFIX}/category"),
        }


    # ------------------------------------------------------------------- Homarr

    def request(method, path, payload=None):
        data = json.dumps(payload).encode() if payload is not None else None
        headers = {"ApiKey": API_KEY}
        if data:
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(HOMARR_URL + path, data=data, headers=headers, method=method)
        with urllib.request.urlopen(req, timeout=60) as resp:
            body = resp.read()
        return json.loads(body) if body else None


    def trpc(procedure, payload):
        return request("POST", f"/api/trpc/{procedure}?batch=1", {"0": {"json": payload}})


    def get_board():
        arg = urllib.parse.quote(json.dumps({"0": {"json": {"name": BOARD_NAME}}}))
        req = urllib.request.Request(f"{HOMARR_URL}/api/trpc/board.getBoardByName?batch=1&input={arg}",
                                     headers={"ApiKey": API_KEY})
        with urllib.request.urlopen(req, timeout=60) as resp:
            return json.load(resp)[0]["result"]["data"]["json"]


    # -------------------------------------------------------------- board edits

    def free_slot(occupied, width):
        """First free (x, y) scanning row by row inside a section of `width` columns."""
        y = 0
        while True:
            for x in range(width):
                if (x, y) not in occupied:
                    return x, y
            y += 1


    def sync_board(apps_by_route, desired):
        """Create/move managed tiles so the board matches the annotations."""
        board = get_board()
        layout_base = next(l["id"] for l in board["layouts"] if l["role"] == "base")
        layout_mobile = next((l["id"] for l in board["layouts"] if l["role"] == "mobile"), None)
        base_cols = next(l["columnCount"] for l in board["layouts"] if l["role"] == "base")
        mobile_cols = next((l["columnCount"] for l in board["layouts"] if l["role"] == "mobile"), None)

        sections = {s["id"]: s for s in board["sections"]}
        containers = {s["options"].get("title"): s["id"] for s in board["sections"] if s.get("kind") == "container"}
        canvas = next((s["id"] for s in board["sections"] if s.get("kind") == "empty" and s.get("xOffset") == 0), None)
        rails = {s["id"] for s in board["sections"] if s.get("kind") == "empty" and s.get("xOffset") in (-1, 1)}

        def section_id_for(item, category):
            if category and category in containers:
                return containers[category]
            if item and item["layouts"][0].get("sectionId") not in rails:
                return item["layouts"][0]["sectionId"]
            return canvas

        items_by_app = {i["options"].get("appId"): i for i in board["items"] if i["kind"] == "app"}
        managed = {i["id"]: i for i in board["items"] if str(i.get("id", "")).startswith(MANAGED_PREFIX)}

        def occupied_in(section_id, layout_id):
            cells = set()
            for it in board["items"]:
                for lay in it.get("layouts", []):
                    if lay.get("layoutId") == layout_id and lay.get("sectionId") == section_id:
                        for dx in range(lay.get("width", 1)):
                            for dy in range(lay.get("height", 1)):
                                cells.add((lay.get("xOffset", 0) + dx, lay.get("yOffset", 0) + dy))
            return cells

        def grow_container(section_id, layout_id, rows):
            for lay in sections[section_id].get("layouts", []):
                if lay["layoutId"] == layout_id and lay.get("height", 1) < rows:
                    lay["height"] = rows

        changed = False
        wanted_app_ids = set()

        for route_id, app in sorted(apps_by_route.items()):
            app_id = app["id"]
            wanted_app_ids.add(app_id)
            item = items_by_app.get(app_id)
            category = desired[route_id]["category"]
            target = section_id_for(item, category)

            if item is None:
                target = containers.get(category, canvas)
                log(f"+ tile {app['name']} -> {'container ' + category if category in containers else 'canvas'}")
                item = {"kind": "app", "options": {"appId": app_id}, "id": f"{MANAGED_PREFIX}{app_id}",
                        "layouts": [], "integrationIds": [],
                        "advancedOptions": {"title": None, "customCssClasses": [], "borderColor": ""}}
                for layout_id, cols in ((layout_base, base_cols), (layout_mobile, mobile_cols)):
                    if not layout_id:
                        continue
                    x, y = free_slot(occupied_in(target, layout_id), cols)
                    item["layouts"].append({"layoutId": layout_id, "yOffset": y, "xOffset": x, "width": 1,
                                            "height": 1, "sectionId": target})
                    grow_container(target, layout_id, y + 1)
                board["items"].append(item)
                changed = True
                continue

            if ENFORCE_CATEGORY and category in containers:
                current = next((l for l in item["layouts"] if l["layoutId"] == layout_base), None)
                if current and current.get("sectionId") != target:
                    log(f"~ tile {app['name']} -> container {category}")
                    for layout_id, cols in ((layout_base, base_cols), (layout_mobile, mobile_cols)):
                        lay = next((l for l in item["layouts"] if l["layoutId"] == layout_id), None)
                        if lay is None and layout_id:
                            lay = {"layoutId": layout_id, "yOffset": 0, "xOffset": 0, "width": 1, "height": 1,
                                   "sectionId": target}
                            item["layouts"].append(lay)
                        if layout_id:
                            x, y = free_slot(occupied_in(target, layout_id), cols)
                            lay.update({"sectionId": target, "xOffset": x, "yOffset": y})
                            grow_container(target, layout_id, y + 1)
                    changed = True

        if PRUNE:
            for item_id, item in managed.items():
                if item["options"].get("appId") not in wanted_app_ids:
                    log(f"- tile {item_id} (no annotated route)")
                    board["items"] = [i for i in board["items"] if i["id"] != item_id]
                    changed = True
        else:
            for item_id, item in managed.items():
                if item["options"].get("appId") not in wanted_app_ids:
                    log(f"! tile {item_id} has no annotated route (PRUNE=false, left alone)")

        if changed and not DRY_RUN:
            trpc("board.saveBoard", board)
            log("board saved")
        return changed


    # --------------------------------------------------------------------- main

    def main():
        if not API_KEY:
            die("HOMARR_API_KEY is not set")

        routes = load_routes()
        desired = {}
        for route in routes:
            parsed = parse_route(route)
            if parsed:
                desired[parsed["id"]] = parsed
        log(f"routes: {len(routes)} total, {len(desired)} annotated")

        existing = request("GET", "/api/apps")
        by_href = {a.get("href"): a for a in existing if a.get("href")}
        by_name = {a["name"]: a for a in existing}

        apps_by_route = {}
        for route_id, want in sorted(desired.items()):
            app = by_href.get(want["href"]) or by_name.get(want["name"])
            if app is None:
                log(f"+ app {want['name']} ({want['href']})")
                if not DRY_RUN:
                    app = request("POST", "/api/apps", {"name": want["name"], "iconUrl": want["iconUrl"],
                                                        "href": want["href"], "description": want["description"],
                                                        "pingUrl": want["pingUrl"]})
                else:
                    app = {"id": "dry-run", "name": want["name"]}
            else:
                drift = {k: want[k] for k in ("name", "iconUrl", "href", "description", "pingUrl")
                         if want[k] != app.get(k)}
                if drift:
                    log(f"~ app {app['name']} fields changed: {', '.join(sorted(drift))}")
                    if not DRY_RUN:
                        request("PATCH", f"/api/apps/{app['id']}",
                                {"name": want["name"], "iconUrl": want["iconUrl"], "href": want["href"],
                                 "description": want["description"], "pingUrl": want["pingUrl"]})
            apps_by_route[route_id] = app

        if PLACE_ITEMS:
            sync_board(apps_by_route, desired)
        log("done" + (" (dry run)" if DRY_RUN else ""))


    if __name__ == "__main__":
        main()
