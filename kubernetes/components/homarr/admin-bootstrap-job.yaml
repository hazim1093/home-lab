apiVersion: batch/v1
kind: Job
metadata:
  name: homarr-admin-bootstrap
  namespace: homarr
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homarr-admin-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: ghcr.io/homarr-labs/homarr:v1.77.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # The app runs migrations at startup, so wait for the schema to exist.
              i=0
              until homarr users-list >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -gt 30 ]; then
                  echo "database not ready after 5m, giving up"
                  exit 1
                fi
                sleep 10
              done
              if [ -z "${ADMIN_USERNAME:-}" ] || [ -z "${ADMIN_PASSWORD:-}" ] || [ "$ADMIN_PASSWORD" = "CHANGEME" ]; then
                echo "Set admin-username/admin-password in homarr-secrets to bootstrap the login. Nothing to do."
                exit 0
              fi
              # Creates a credentials admin only if none exists yet (no-op afterwards).
              homarr recreate-admin -u "$ADMIN_USERNAME"
              # Enforces the password from the secret and ends that user's sessions.
              homarr update-password -u "$ADMIN_USERNAME" -p "$ADMIN_PASSWORD"
              echo "admin credentials applied for ${ADMIN_USERNAME}"
          env:
            - name: AUTH_PROVIDERS
              value: "credentials"
            - name: DB_DRIVER
              value: "better-sqlite3"
            - name: DB_DIALECT
              value: "sqlite"
            - name: DB_URL
              value: "/appdata/db.sqlite"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: db-encryption-key
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: admin-password
          volumeMounts:
            - name: homarr-database
              mountPath: /appdata
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: homarr-database
          persistentVolumeClaim:
            claimName: homarr-database
