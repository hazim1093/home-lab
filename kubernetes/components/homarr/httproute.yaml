apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homarr
  namespace: homarr
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      url: "http://homarr.homarr.svc.cluster.local:7575/api/health/ready"
      interval: 60s
      conditions:
        - "[STATUS] == 200"
    item.homer.rajsingh.info/name: "Homarr"
    item.homer.rajsingh.info/icon: "fas fa-table-cells"
    item.homer.rajsingh.info/subtitle: "integrations, drag and drop"
    service.homer.rajsingh.info/name: "Dashboards"
    service.homer.rajsingh.info/icon: "fas fa-tachometer-alt"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "homarr.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: homarr
      port: 7575
