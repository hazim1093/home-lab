apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
  namespace: homarr
spec:
  interval: 12h
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: homarr
      version: "8.29.0"
      sourceRef:
        kind: HelmRepository
        name: homarr
        namespace: flux-system
      interval: 12h
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/homarr-labs/homarr
      tag: "v1.77.0"
      pullPolicy: IfNotPresent
    env:
      TZ: "Europe/Stockholm"
      LOG_LEVEL: "info"
      AUTH_PROVIDERS: "credentials"
    envSecrets:
      dbEncryption:
        existingSecret: "homarr-secrets"
        key: "db-encryption-key"
    database:
      type: sqlite
    persistence:
      homarrDatabase:
        enabled: true
        size: "1Gi"
    # Read-only cluster view (Management > Tools > Kubernetes). Creates a
    # ServiceAccount + ClusterRole; the role reads secrets, see the README.
    rbac:
      enabled: true
    service:
      ports:
        app:
          port: 7575
    # HTTPRoute is defined in this directory so it carries the gatus annotations.
    httproute:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
