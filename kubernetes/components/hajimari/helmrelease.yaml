apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hajimari
  namespace: hajimari
spec:
  interval: 12h
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: hajimari
      version: "2.0.2"
      sourceRef:
        kind: HelmRepository
        name: hajimari
        namespace: flux-system
      interval: 12h
  values:
    image:
      repository: ghcr.io/toboshii/hajimari
      tag: v0.3.1
      pullPolicy: IfNotPresent
    env:
      TZ: Europe/Stockholm
    # Chart RBAC lets it read Ingresses/EndpointSlices cluster-wide.
    serviceAccount:
      create: true
    service:
      main:
        ports:
          http:
            port: 3000
    persistence:
      data:
        enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    hajimari:
      instanceName: hajimari
      title: "Home Lab"
      name: "Hermes"
      # Upstream Hajimari only discovers Ingress objects (no Gateway API support),
      # so the list below is static. defaultEnable is left on for any future Ingress.
      defaultEnable: true
      namespaceSelector:
        any: true
        matchNames: []
      showGreeting: true
      showAppGroups: true
      showAppUrls: true
      showAppStatus: false
      defaultSearchProvider: Google
      customApps:
        - group: Dashboards
          apps:
            - name: Homarr
              url: "https://homarr.${LOCAL_DOMAIN}"
              icon: mdi:view-grid
              info: "integrations, drag and drop"
        - group: Home
          apps:
            - name: Home Assistant
              url: "https://home.${LOCAL_DOMAIN}"
              icon: mdi:home-assistant
        - group: Infrastructure
          apps:
            - name: Gatus
              url: "https://gatus.${LOCAL_DOMAIN}"
              icon: mdi:heart-pulse
            - name: Pi-hole
              url: "https://pihole.${LOCAL_DOMAIN}"
              icon: mdi:pi-hole
        - group: AI
          apps:
            - name: Hermes
              url: "https://hermes.${LOCAL_DOMAIN}"
              icon: mdi:robot
            - name: Hermes Workspace
              url: "https://hermes-workspace.${LOCAL_DOMAIN}"
              icon: mdi:monitor-dashboard
