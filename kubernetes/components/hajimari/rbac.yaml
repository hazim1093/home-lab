# Read access to the Application CRD added by crd.yaml (the chart's own ClusterRole only covers
# ingresses/endpointslices). Without it the discovery loop logs a Forbidden error every refresh.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hajimari-applications
rules:
- apiGroups:
  - hajimari.io
  resources:
  - applications
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hajimari-applications
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hajimari-applications
subjects:
- kind: ServiceAccount
  name: hajimari
  namespace: hajimari
