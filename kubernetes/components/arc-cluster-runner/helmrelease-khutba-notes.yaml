# Personal accounts have no account-level runners (only orgs do): one scale set
# per repo, sharing the arc-cluster-runner label so workflows stay unchanged.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-cluster-runner-khutba-notes
  namespace: arc-system
spec:
  interval: 12h
  dependsOn:
    - name: arc-controller
      namespace: arc-system
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
      interval: 12h
  values:
    githubConfigUrl: "https://github.com/hazim1093/khutba-notes"
    githubConfigSecret: arc-cluster-runner-secret
    # Distinct scale-set name (the AutoscalingRunnerSet is named after it, so it
    # must not collide with the screener-rag one) + the shared runner label.
    runnerScaleSetName: arc-cluster-runner-khutba-notes
    scaleSetLabels:
      - arc-cluster-runner
    minRunners: 0
    maxRunners: 1
    template:
      spec:
        serviceAccountName: arc-cluster-runner
        containers:
          - name: runner
            image: ghcr.io/hazim1093/arc-runner:latest
            command: ["/home/runner/run.sh"]
