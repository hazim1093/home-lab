apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homer-operator
  namespace: homer-operator
spec:
  interval: 12h
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: homer-operator
      version: "1.2.4"
      sourceRef:
        kind: HelmRepository
        name: homer-operator
        namespace: flux-system
      interval: 12h
  values:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    operator:
      # Watch Gateway API HTTPRoutes (this cluster has no Ingress objects).
      enableGatewayAPI: true
      metrics:
        enabled: false
    homer:
      image:
        repository: b4bz/homer
        # Chart default is :latest; pinned so the dashboards image is reproducible.
        tag: "v26.08.3"
    highAvailability:
      podDisruptionBudget:
        enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
