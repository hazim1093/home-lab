apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:

    # HTTP settings (use_x_forwarded_for / trusted_proxies) are managed in
    # the UI: Settings > System > Network (YAML config deprecated since 2025.1)
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # Themes installed via HACS land in /config/themes/<name>/ (nested)
    frontend:
      themes: !include_dir_merge_named themes/mushroom

    # Backups
    backup:
