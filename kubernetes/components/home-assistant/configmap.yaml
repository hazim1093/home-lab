apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # Themes installed via HACS land in /config/themes/<name>/ (nested)
    frontend:
      themes: !include_dir_merge_named themes/mushroom

    # Backups
    backup:
