apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:

    # HTTP settings (use_x_forwarded_for / trusted_proxies) are managed in
    # the UI: Settings > System > Network (YAML config deprecated since 2025.1)
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # HACS installs themes into a nested dir HA's include can't scan — define inline
    frontend:
      themes:
        Mushroom Shadow:
          ha-card-box-shadow: 0px 2px 4px 0px rgba(0,0,0,0.16)
          ha-card-border-width: 0
          modes:
            light: {}
            dark: {}
        Mushroom Square:
          ha-badge-border-radius: 6px
          ha-card-border-radius: 6px
          ha-card-features-border-radius: 6px
          ha-tile-icon-border-radius: 6px
          mush-spacing: 8px
          mush-icon-border-radius: 6px
          mush-control-border-radius: 6px
          mush-chip-border-radius: 6px
          modes:
            light: {}
            dark: {}
        Mushroom Square Shadow:
          ha-badge-border-radius: 6px
          ha-card-box-shadow: 0px 2px 4px 0px rgba(0,0,0,0.16)
          ha-card-border-width: 0
          ha-card-border-radius: 6px
          ha-card-features-border-radius: 6px
          ha-tile-icon-border-radius: 6px
          mush-spacing: 8px
          mush-icon-border-radius: 6px
          mush-control-border-radius: 6px
          mush-chip-border-radius: 6px
          modes:
            light: {}
            dark: {}

    # Backups
    backup:
