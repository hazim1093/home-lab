apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      url: "http://home-assistant.home-assistant.svc.cluster.local:8123"
      interval: 60s
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "homeassistant.lab"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: home-assistant
      port: 8123
