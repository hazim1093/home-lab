apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 12h
  chart:
    spec:
      chart: home-assistant
      version: "0.3.87"
      sourceRef:
        kind: HelmRepository
        name: home-assistant
        namespace: flux-system
      interval: 12h
  values:
    persistence:
      enabled: true
      size: 5Gi
    service:
      type: ClusterIP
      port: 8123
    additionalVolumes:
      - name: config
        configMap:
          name: home-assistant-config
      - name: custom-components
        configMap:
          name: home-assistant-custom-components
    additionalMounts:
      - name: config
        mountPath: /config/configuration.yaml
        subPath: configuration.yaml
    initContainers:
      - name: create-config-files
        image: busybox:1.38
        command:
          - sh
          - -c
          - |
            # Create automation files if they don't exist
            for file in automations.yaml scripts.yaml scenes.yaml; do
              if [ ! -f "/config/$file" ]; then
                echo "Creating /config/$file"
                if [ "$file" = "scripts.yaml" ]; then
                  echo "{}" > "/config/$file"
                else
                  echo "[]" > "/config/$file"
                fi
              else
                echo "/config/$file already exists"
              fi
            done
        volumeMounts:
          - name: home-assistant
            mountPath: /config
      - name: install-custom-components
        image: busybox:1.38
        command:
          - sh
          - -c
          - |
            set -e
            mkdir -p /config/custom_components

            # custom_components must only contain component dirs - clean up
            # stray files left by the old flat extraction
            find /config/custom_components -maxdepth 1 -type f -delete

            while IFS='|' read -r name url || [ -n "$name" ]; do
              if [ -z "$name" ]; then
                continue
              fi
              case "$name" in \#*) continue ;; esac

              # Trim whitespace (block scalar indent / stray spaces)
              name=$(printf '%s' "$name" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
              url=$(printf '%s' "$url" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
              [ -z "$name" ] && continue

              echo "Installing $name..."
              wget -qO /tmp/component.zip "$url"
              rm -rf /tmp/extract
              mkdir -p /tmp/extract
              unzip -q /tmp/component.zip -d /tmp/extract

              # Locate the component dir: flat zips keep files at the archive
              # root (manifest.json), source archives nest it under
              # custom_components/<name> (possibly in a wrapper folder)
              if [ -f /tmp/extract/manifest.json ]; then
                src=/tmp/extract
              else
                src=$(find /tmp/extract -type d -path "*/custom_components/$name" | head -1)
                if [ -z "$src" ]; then
                  echo "ERROR: could not locate component '$name' in archive"
                  exit 1
                fi
              fi

              # Overwrite so a version bump in the manifest applies on next start
              rm -rf "/config/custom_components/$name"
              mkdir -p "/config/custom_components/$name"
              cp -r "$src"/. "/config/custom_components/$name/"
              rm -rf /tmp/extract /tmp/component.zip
              echo "$name installed"
            done < /custom-components/components.txt
        volumeMounts:
          - name: home-assistant
            mountPath: /config
          - name: custom-components
            mountPath: /custom-components
      # HA 2026.8+ keeps HTTP server settings in .storage/http and ignores the
      # configuration.yaml http: block after the one-time import, so a rebuild
      # (or a restore of an older backup) loses the proxy trust and every
      # request through Traefik gets 400 Bad Request from the forwarded module.
      # Patch the store before HA starts; a no-op when it is already correct.
      - name: patch-http-proxy-trust
        image: ghcr.io/home-assistant/home-assistant:2026.10.2
        command:
          - python3
          - -c
          - |
            import json, os, pathlib, sys
            store = pathlib.Path("/config/.storage/http")
            if not store.is_file():
                print("no .storage/http yet - the http: block in configuration.yaml is imported on first start")
                sys.exit(0)
            try:
                doc = json.loads(store.read_text())
            except Exception as exc:
                print(f"unreadable .storage/http, leaving it to HA: {exc}")
                sys.exit(0)
            slots = doc.setdefault("data", {})
            changed = []
            for slot in ("stable", "pending"):
                cfg = slots.get(slot)
                if not isinstance(cfg, dict):
                    continue
                if cfg.get("use_x_forwarded_for") is not True:
                    cfg["use_x_forwarded_for"] = True
                    changed.append(slot)
                proxies = cfg.setdefault("trusted_proxies", [])
                for cidr in ("10.42.0.0/16", "10.43.0.0/16"):
                    if cidr not in proxies:
                        proxies.append(cidr)
                        if slot not in changed:
                            changed.append(slot)
            if changed:
                store.write_text(json.dumps(doc))
                os.chmod(store, 0o600)
                print("patched HTTP proxy trust in slot(s):", ", ".join(sorted(set(changed))))
            else:
                print("HTTP proxy trust already configured")
        volumeMounts:
          - name: home-assistant
            mountPath: /config

  # Pin the dishwasher's Home Connect Local hostname to its IP at pod level
  # (no mDNS in k8s; chart lacks a hostAliases value, hence this patch)
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: home-assistant
            patch: |-
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: 192.168.0.84
                    hostnames:
                      - bosch-dishwasher-012060522931003141
