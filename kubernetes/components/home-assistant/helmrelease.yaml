apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 12h
  chart:
    spec:
      chart: home-assistant
      version: "0.3.75"
      sourceRef:
        kind: HelmRepository
        name: home-assistant
        namespace: flux-system
      interval: 12h
  values:
    persistence:
      enabled: true
      size: 5Gi
    service:
      type: ClusterIP
      port: 8123
    additionalVolumes:
      - name: config
        configMap:
          name: home-assistant-config
      - name: custom-components
        configMap:
          name: home-assistant-custom-components
    additionalMounts:
      - name: config
        mountPath: /config/configuration.yaml
        subPath: configuration.yaml
    initContainers:
      - name: create-config-files
        image: busybox:1.37
        command:
          - sh
          - -c
          - |
            # Create automation files if they don't exist
            for file in automations.yaml scripts.yaml scenes.yaml; do
              if [ ! -f "/config/$file" ]; then
                echo "Creating /config/$file"
                if [ "$file" = "scripts.yaml" ]; then
                  echo "{}" > "/config/$file"
                else
                  echo "[]" > "/config/$file"
                fi
              else
                echo "/config/$file already exists"
              fi
            done
        volumeMounts:
          - name: home-assistant
            mountPath: /config
      - name: install-custom-components
        image: busybox:1.37
        command:
          - sh
          - /custom-components/install.sh
        volumeMounts:
          - name: home-assistant
            mountPath: /config
          - name: custom-components
            mountPath: /custom-components
