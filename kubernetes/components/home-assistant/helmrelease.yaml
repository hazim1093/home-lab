apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 12h
  chart:
    spec:
      chart: home-assistant
      version: "0.3.31"
      sourceRef:
        kind: HelmRepository
        name: home-assistant
        namespace: flux-system
      interval: 12h
  values:
    persistence:
      enabled: true
      size: 5Gi
    service:
      type: ClusterIP
      port: 8123
