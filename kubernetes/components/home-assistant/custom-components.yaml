apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-custom-components
  namespace: home-assistant
data:
  # Format: name|download_url|extract_to_subdir
  # - name: directory name under custom_components
  # - download_url: URL to download the zip file
  # - extract_to_subdir: "true" if zip should extract to custom_components/name,
  #                      "false" if zip already contains the folder structure
  components.txt: |
    hacs|https://github.com/hacs/integration/releases/latest/download/hacs.zip|true
    xiaomi_miot|https://github.com/al-one/hass-xiaomi-miot/releases/latest/download/xiaomi_miot.zip|false
