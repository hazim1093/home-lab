apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-custom-components
  namespace: home-assistant
data:
  # Declarative custom component installs, applied by the helmrelease init
  # container on pod start. Format: name|download_url
  # Versions are pinned (never "latest") and bumped by Renovate (regex manager
  # in renovate.json); a pod restart applies the new version.
  components.txt: |
    hacs|https://github.com/hacs/integration/releases/download/2.0.5/hacs.zip
    xiaomi_miot|https://github.com/al-one/hass-xiaomi-miot/releases/download/v1.1.4/xiaomi_miot.zip
    localtuya|https://github.com/xZetsubou/hass-localtuya/archive/refs/tags/2026.7.0.zip
