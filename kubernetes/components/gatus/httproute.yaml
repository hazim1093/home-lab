apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: gatus
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      url: "http://gatus.gatus.svc.cluster.local"
      interval: 60s
      conditions:
        - "[STATUS] == 200"
    homarr.dev/enabled: "true"
    homarr.dev/name: "Gatus"
    homarr.dev/url: "https://gatus.${LOCAL_DOMAIN}"
    homarr.dev/icon: "gatus"
    homarr.dev/ping-url: "http://gatus.gatus.svc.cluster.local"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "gatus.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gatus
      port: 80
