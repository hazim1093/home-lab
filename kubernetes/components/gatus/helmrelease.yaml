apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 12h
  upgrade:
    remediation:
      retries: 5
  chart:
    spec:
      chart: gatus
      version: "1.4.4"
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
      interval: 12h
  values:
    # Use ServiceAccount for RBAC (created separately)
    serviceAccount:
      create: false
      name: gatus

    # Enable persistence
    persistence:
      enabled: true
      size: 200Mi

    # Configure Gatus - this will be the base config.yaml
    config:
      # Enable directory-based config loading
      # Gatus will merge all .yaml files from /config/
      storage:
        type: sqlite
        path: /data/data.db

      alerting:
        slack:
          webhook-url: "${SLACK_WEBHOOK_URL}"
          default-alert:
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true
            description: "Health check alert"

      # Static endpoints for DNS checks (not auto-discoverable via HTTPRoute)
      endpoints:
        # Pi-hole DNS Service - queries via Pi-hole DNS server
        - name: Pi-hole DNS
          group: DNS Services
          url: "pihole-dns-udp.pihole.svc.cluster.local:53"
          interval: 60s
          dns:
            query-name: "google.com"
            query-type: "A"
          conditions:
            - "[DNS_RCODE] == NOERROR"
          alerts:
            - type: slack
              description: "Pi-hole DNS is not responding correctly"
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true

    # Environment variables for substitution in config
    env:
      GATUS_CONFIG_PATH: /config
      SLACK_WEBHOOK_URL:
        valueFrom:
          secretKeyRef:
            name: slack-webhook-url
            key: url
            optional: false

    # Copy ConfigMap to writable volume on init
    extraInitContainers:
      - name: copy-config
        image: busybox:latest
        command:
          - sh
          - -c
          - |
            cp /config-ro/config.yaml /config/config.yaml
            echo "Config copied to writable volume"
        volumeMounts:
          - name: gatus-config
            mountPath: /config-ro
          - name: config
            mountPath: /config

    # Mount writable config directory in main container
    extraVolumeMounts:
      - name: config
        mountPath: /config

    # Add gatus-sidecar container for auto-discovery of HTTPRoutes
    sidecarContainers:
      gatus-sidecar:
        image: ghcr.io/home-operations/gatus-sidecar:latest
        imagePullPolicy: IfNotPresent
        args:
          - -auto-httproute
          - -gateway-name=traefik-gateway
          - -output=/config/gatus-sidecar.yaml
          - -default-interval=1m
        volumeMounts:
          - name: config
            mountPath: /config
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 64Mi
            cpu: 100m
