apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: gatus
  namespace: gatus
spec:
  interval: 12h
  chart:
    spec:
      chart: gatus
      version: "1.4.4"
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
      interval: 12h
  values:
    # Use ServiceAccount for RBAC (created separately)
    serviceAccount:
      create: false
      name: gatus

    # Enable persistence
    persistence:
      enabled: true
      size: 200Mi

    # Configure Gatus
    config:
      storage:
        type: sqlite
        path: /data/data.db

      alerting:
        slack:
          webhook-url: "${SLACK_WEBHOOK_URL}"
          default-alert:
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true
            description: "Health check alert"

      # Static endpoints for DNS checks (not auto-discoverable via HTTPRoute)
      endpoints:
        # Pi-hole DNS Service - queries via Pi-hole DNS server
        - name: Pi-hole DNS
          group: DNS Services
          url: "pihole.pihole.svc.cluster.local"
          interval: 60s
          dns:
            query-name: "google.com"
            query-type: "A"
          conditions:
            - "[DNS_RCODE] == NOERROR"
          alerts:
            - type: slack
              description: "Pi-hole DNS is not responding correctly"
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true

        # Unbound DNS - verify upstream resolver is working
        - name: Unbound DNS (upstream)
          group: DNS Services
          url: "pihole.pihole.svc.cluster.local"
          interval: 60s
          dns:
            query-name: "cloudflare.com"
            query-type: "A"
          conditions:
            - "[DNS_RCODE] == NOERROR"
            - "[BODY] == pat(*.*.*.*)"
          alerts:
            - type: slack
              description: "Unbound DNS resolver is not responding"
              failure-threshold: 3
              success-threshold: 2
              send-on-resolved: true

      # HTTPRoute endpoints will be auto-discovered by gatus-sidecar
      # and written to /config/gatus-sidecar.yaml
      external-endpoints:
        - /config/gatus-sidecar.yaml

    # Environment variables for substitution in config
    env:
      - name: SLACK_WEBHOOK_URL
        valueFrom:
          secretKeyRef:
            name: slack-webhook-url
            key: url
            optional: false

    # Add gatus-sidecar container for auto-discovery of HTTPRoutes
    extraContainers:
      - name: gatus-sidecar
        image: ghcr.io/home-operations/gatus-sidecar:v0.3.0
        imagePullPolicy: IfNotPresent
        args:
          - --auto-httproute
          - --gateway-name=traefik-gateway
          - --gateway-namespace=traefik
          - --output=/config/gatus-sidecar.yaml
          - --default-interval=1m
        volumeMounts:
          - name: config
            mountPath: /config
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 64Mi
            cpu: 100m
