# No gatus/homarr health check: paperless scales to 0 when idle, and a
# periodic ping would keep it awake or falsely alert "down".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
  namespace: paperless
  annotations:
    homarr.dev/enabled: "true"
    homarr.dev/category: "Homelab Apps"
    homarr.dev/name: "Paperless"
    homarr.dev/url: "https://paperless.${LOCAL_DOMAIN}"
    homarr.dev/icon: "paperless-ngx"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "paperless.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Routes via the KEDA interceptor, not the paperless Service, to scale up on demand.
    backendRefs:
    - name: keda-add-ons-http-interceptor-proxy
      namespace: keda-http
      port: 8080
