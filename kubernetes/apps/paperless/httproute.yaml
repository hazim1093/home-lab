# No gatus/homarr periodic health check here: paperless scales to 0 when
# idle (httpscaledobject.yaml), so a periodic ping would either keep it
# perpetually awake or falsely alert "down" while idle. homarr.dev/url below
# still gives it a dashboard tile — clicking it is real traffic, and it wakes
# the app the way any other visit does.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
  namespace: paperless
  annotations:
    homarr.dev/enabled: "true"
    homarr.dev/category: "Homelab Apps"
    homarr.dev/name: "Paperless"
    homarr.dev/url: "https://paperless.${LOCAL_DOMAIN}"
    homarr.dev/icon: "paperless-ngx"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "paperless.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Routes through the KEDA HTTP interceptor instead of the paperless
    # Service directly, so a request triggers scale-up from 0.
    backendRefs:
    - name: keda-add-ons-http-interceptor-proxy
      namespace: keda-http
      port: 8080
