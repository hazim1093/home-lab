# Excluded from gatus on purpose: a 60s probe would cold-start this scale-to-zero
# app every few minutes. The sidecar runs --auto-httproute, so omit is not exclude.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless
  namespace: paperless
  annotations:
    # Only "true"/"1" includes; anything else forces exclusion even in auto mode.
    gatus.home-operations.com/enabled: "false"
    homarr.dev/enabled: "true"
    homarr.dev/category: "Homelab Apps"
    homarr.dev/name: "Paperless"
    homarr.dev/url: "https://paperless.${LOCAL_DOMAIN}"
    homarr.dev/icon: "paperless-ngx"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "paperless.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    # Routes via the KEDA interceptor, not the paperless Service, to scale up on demand.
    backendRefs:
    - name: keda-add-ons-http-interceptor-proxy
      namespace: keda-http
      port: 8080
