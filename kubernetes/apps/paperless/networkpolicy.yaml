apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-restrict-ingress
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app: paperless
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: paperless
    # The KEDA HTTP interceptor connects to the pod directly (direct pod
    # routing), not via the Service — traefik no longer talks to this
    # namespace at all (see httproute.yaml).
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keda-http
