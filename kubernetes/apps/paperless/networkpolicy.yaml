apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-restrict-ingress
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app: paperless
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: paperless
    # The KEDA interceptor connects to the pod directly (not via the Service).
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keda-http
