# paperless-data: SQLite DB, search index, classifier model, thumbnails, and
# the on-disk Swedish tessdata file fetched by the init container (see
# deployment.yaml). Small, but the search index can grow with the archive.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
# paperless-media: the actual documents (originals + generated archive PDFs +
# thumbnails). This is the volume that matters most for the backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: local-path
---
# paperless-consume: drop-folder for new documents. Kept small — files are
# moved out (into media) once consumed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
# paperless-export: scratch space for the nightly `document_exporter` dump
# that the backup CronJob then feeds to restic. Not a substitute for the
# backup itself — it's local-path (single node, no redundancy) and is
# overwritten in place every night.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-export
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: local-path
