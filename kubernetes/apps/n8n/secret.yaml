# PLACEHOLDER: replace and encrypt before merging:
#   openssl rand -hex 32
#   sops --encrypt --in-place kubernetes/apps/n8n/secret.yaml
# The key encrypts every stored credential. Back it up; losing it loses them.
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: n8n
stringData:
  N8N_ENCRYPTION_KEY: REPLACE_WITH_openssl_rand_hex_32
