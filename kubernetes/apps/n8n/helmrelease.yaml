apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 12h
  chart:
    spec:
      chart: n8n
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system
      interval: 12h
  values:
    # Standalone: one pod, SQLite on a PVC. No Postgres/Redis/workers.
    queueMode:
      enabled: false
    database:
      type: sqlite
      useExternal: false
    redis:
      enabled: false

    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path

    # Provides N8N_ENCRYPTION_KEY (see secret.yaml).
    secretRefs:
      existingSecret: n8n-secrets

    # Public URL: sets OAuth redirects and webhook URLs.
    editor:
      url: "https://n8n.${LOCAL_DOMAIN}"

    # A PDB with one replica would block node drains.
    pdb:
      enabled: false

    # Routing is in httproute.yaml (the 1.x chart has no HTTPRoute support).
    ingress:
      enabled: false
