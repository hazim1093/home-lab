apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 12h
  chart:
    spec:
      chart: n8n
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system
      interval: 12h
  values:
    queueMode:
      enabled: false
    database:
      type: sqlite
      useExternal: false
    redis:
      enabled: false

    # Node CPU is 95% reserved; chart default 200m request doesn't fit.
    resources:
      main:
        requests:
          cpu: 100m
          memory: 256Mi

    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path

    secretRefs:
      existingSecret: n8n-secrets

    editor:
      url: "https://n8n.${LOCAL_DOMAIN}"
    webhook:
      url: "https://n8n.${LOCAL_DOMAIN}"

    pdb:
      enabled: false

    ingress:
      enabled: false
