apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: n8n
  annotations:
    homarr.dev/enabled: "true"
    homarr.dev/category: "Homelab Apps"
    homarr.dev/name: "n8n"
    homarr.dev/url: "https://n8n.${LOCAL_DOMAIN}"
    homarr.dev/icon: "n8n"
    homarr.dev/ping-url: "http://n8n-main.n8n.svc.cluster.local:5678/healthz"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "n8n.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: n8n-main
      port: 5678
