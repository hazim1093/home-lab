apiVersion: apps/v1
kind: Deployment
metadata:
  name: screener-api
  namespace: screener
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: screener-api
  template:
    metadata:
      labels:
        app: screener-api
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: api
        image: ghcr.io/hazim1093/screener-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - secretRef:
            name: screener-secrets
        - configMapRef:
            name: screener-config
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: screener-api
  namespace: screener
spec:
  selector:
    app: screener-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
