apiVersion: apps/v1
kind: Deployment
metadata:
  name: screener-api
  namespace: screener
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: screener-api
  template:
    metadata:
      labels:
        app: screener-api
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: api
        image: ghcr.io/hazim1093/screener-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: screener-secrets
              key: TAVILY_API_KEY
        - name: LLM_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: screener-config
              key: LLM_PROVIDER
        - name: LLM_MODEL
          valueFrom:
            configMapKeyRef:
              name: screener-config
              key: LLM_MODEL
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: screener-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: screener-secrets
              key: OPENAI_API_KEY
              optional: true
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: screener-api
  namespace: screener
spec:
  selector:
    app: screener-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
