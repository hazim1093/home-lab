# NEXT_PUBLIC_API_URL is baked at image build time — not a runtime env var.
# Build the image with: docker build --build-arg NEXT_PUBLIC_API_URL=https://screener-api.${LOCAL_DOMAIN}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: screener-frontend
  namespace: screener
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: screener-frontend
  template:
    metadata:
      labels:
        app: screener-frontend
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: frontend
        image: ghcr.io/hazim1093/screener-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: screener-frontend
  namespace: screener
spec:
  selector:
    app: screener-frontend
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
