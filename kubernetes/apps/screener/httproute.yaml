apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: screener-frontend
  namespace: screener
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      url: "http://screener-frontend.screener.svc.cluster.local:3000"
      interval: 60s
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - "screener.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: screener-frontend
      port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: screener-api
  namespace: screener
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |
      url: "http://screener-api.screener.svc.cluster.local:8000/health"
      interval: 60s
      conditions:
        - "[STATUS] == 200"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - "screener-api.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: screener-api
      port: 8000
