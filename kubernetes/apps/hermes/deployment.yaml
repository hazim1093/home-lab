apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      # Off: HERMES_DASHBOARD_PORT auto-injected from the hermes-dashboard
      # Service collides with the app's own env var of the same name.
      enableServiceLinks: false
      imagePullSecrets:
      - name: ghcr-pull-secret
      # Dedicated SA (not "default") bound to the view ClusterRole, so the
      # agent's cluster access is separately named/revocable.
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      initContainers:
      # Installs jq + kubectl + gh onto /opt/data/.local/bin, already on the
      # image's PATH — no shell wrapper needed on the main containers.
      # git/curl skipped: already in the base image. jq is the static
      # release binary, not apt, to avoid needing its .so deps on PATH.
      - name: install-tools
        image: ghcr.io/hazim1093/hermes-agent
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /opt/data
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          BIN_DIR=/opt/data/.local/bin
          MARKER="$BIN_DIR/.installed"
          mkdir -p "$BIN_DIR"

          # Base tools (kubectl, jq, gh) — one-time, marker-gated
          if [ ! -f "$MARKER" ]; then
            KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
            curl -fsSL -o "$BIN_DIR/kubectl" \
              "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
            chmod +x "$BIN_DIR/kubectl"

            JQ_VERSION="jq-1.7.1"
            curl -fsSL -o "$BIN_DIR/jq" \
              "https://github.com/jqlang/jq/releases/download/$JQ_VERSION/jq-linux-amd64"
            chmod +x "$BIN_DIR/jq"

            GH_VERSION="2.97.0"
            curl -fsSL "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz" \
              | tar -xz -C /tmp "gh_${GH_VERSION}_linux_amd64/bin/gh"
            mv "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$BIN_DIR/gh"
            chmod +x "$BIN_DIR/gh"

            touch "$MARKER"
          fi

          # gcloud SDK — separate gate so existing PVCs (marker already set)
          # still get it on the next rollout
          if [ ! -x "$BIN_DIR/gcloud" ]; then
            GCLOUD_VERSION="580.0.0"
            curl -fsSL -o /tmp/gcloud.tar.gz \
              "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-${GCLOUD_VERSION}-linux-x86_64.tar.gz"
            tar -xzf /tmp/gcloud.tar.gz -C /opt/data/.local
            for b in gcloud gsutil bq; do
              ln -sf "/opt/data/.local/google-cloud-sdk/bin/$b" "$BIN_DIR/$b"
            done
            rm -f /tmp/gcloud.tar.gz
          fi

          # OpenTofu — same separate gate as gcloud (marker already set on
          # existing PVCs; tofu is new)
          if [ ! -x "$BIN_DIR/tofu" ]; then
            TOFU_VERSION="1.12.6"
            curl -fsSL -o /tmp/tofu.tar.gz \
              "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
            tar -xzf /tmp/tofu.tar.gz -C "$BIN_DIR" tofu
            chmod +x "$BIN_DIR/tofu"
            rm -f /tmp/tofu.tar.gz
          fi

          chown -R 10000:10000 /opt/data/.local
          echo "tools installed"
      containers:
      # No `command:` override — keep the image's own ENTRYPOINT (s6 init)
      # intact and only set `args:`, same as upstream's docker-compose.yml.
      # Overriding command bypasses privilege drop / config bootstrap and
      # there's no bare `gateway`/`dashboard` binary to exec directly.
      # One container, not two: HERMES_DASHBOARD=1 makes the image's own s6
      # supervise dashboard alongside gateway-default, sharing one /run/service
      # — required for the dashboard's Start/Stop-gateway control to see
      # gateway at all (it signals a local sibling s6 service, not cross-container).
      - name: gateway
        image: ghcr.io/hazim1093/hermes-agent
        imagePullPolicy: IfNotPresent
        args: ["gateway", "run"]
        envFrom:
        - secretRef:
            name: hermes-secrets
        - configMapRef:
            name: hermes-config
        env:
        - name: HERMES_DASHBOARD
          value: "1"
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: hermes-dashboard-internal-auth
              key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-dashboard-internal-auth
              key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        ports:
        - containerPort: 8642
          name: gateway
        - containerPort: 9119
          name: dashboard
        volumeMounts:
        - name: data
          mountPath: /opt/data
        resources:
          requests:
            memory: 512Mi
            cpu: 150m
          limits:
            # was 1536Mi; raised after repeated whole-cgroup OOM kills
            memory: 3072Mi
            cpu: 1500m
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
