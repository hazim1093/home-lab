apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      # Off: HERMES_DASHBOARD_PORT auto-injected from the hermes-dashboard
      # Service collides with the app's own env var of the same name.
      enableServiceLinks: false
      # Dedicated SA (not "default") bound to the view ClusterRole, so the
      # agent's cluster access is separately named/revocable.
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      initContainers:
      # Per-turn credential/allowlist reads come from <HERMES_HOME>/.env, never the
      # pod env (the gateway runs with gateway.multiplex_profiles), so render the
      # Secret's credential keys there. Key names are chosen by suffix; see the script.
      - name: render-profile-env
        image: docker.io/nousresearch/hermes-agent
        imagePullPolicy: IfNotPresent
        command: ["/opt/hermes/.venv/bin/python3", "-c"]
        args:
          - |
            import os
            from pathlib import Path

            SUFFIXES = ("_API_KEY", "_TOKEN", "_ALLOWED_USERS", "_ALLOW_ALL_USERS", "_ALLOWED_CHATS")
            EXACT = {"API_SERVER_KEY"}
            EXTRA = set(os.environ.get("HERMES_PROFILE_ENV_EXTRA", "").split())

            def managed(key):
                return key in EXACT or key in EXTRA or key.endswith(SUFFIXES)

            ok = {k: v for k, v in os.environ.items()
                  if managed(k) and v and "\n" not in v and not v.startswith("REPLACE_WITH")}
            bad = sorted(k for k in os.environ if managed(k) and k not in ok)

            path = Path(os.environ.get("HERMES_HOME", "/opt/data")) / ".env"
            lines = path.read_text().splitlines() if path.exists() else []
            out, written = [], set()
            for line in lines:
                key = line.split("=", 1)[0].strip() if "=" in line and not line.lstrip().startswith("#") else None
                if key in ok:
                    out.append(f"{key}={ok[key]}")
                    written.add(key)
                elif key is not None and managed(key):
                    pass  # removed from the Secret: drop the stale copy
                else:
                    out.append(line)  # hand-maintained lines (home channel) survive
            added = sorted(set(ok) - written)
            out += [f"{k}={ok[k]}" for k in added]
            tmp = path.with_name(".env.render.tmp")
            tmp.write_text("\n".join(out).rstrip("\n") + "\n")
            os.chmod(tmp, 0o600)
            os.replace(tmp, path)
            print("hermes .env updated:", ", ".join(sorted(written)) or "-")
            print("hermes .env added:", ", ".join(added) or "-")
            print("skipped (empty/multiline):", ", ".join(bad) or "-")
            print("hermes .env lines:", len(out))
        envFrom:
        - secretRef:
            name: hermes-secrets
        env:
        - name: HERMES_HOME
          value: /opt/data
        volumeMounts:
        - name: data
          mountPath: /opt/data
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
      # Tools (kubectl, jq, gh, gcloud, tofu) live on the shared PVC and are
      # bootstrapped here once; the marker file makes every later start a no-op.
      - name: install-tools
        image: docker.io/nousresearch/hermes-agent
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command: ["bash", "-c"]
        args:
        - |
          set -uo pipefail
          BIN_DIR=/opt/data/.local/bin
          MARKER="$BIN_DIR/.installed"
          mkdir -p "$BIN_DIR"

          fetch() {
            for _ in 1 2 3; do
              curl -fsSL "$1" -o "$2" && return 0
              sleep 5
            done
            return 1
          }

          if [ ! -f "$MARKER" ]; then
            KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt || true)"
            if [ -n "$KUBECTL_VERSION" ]; then
              fetch "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl" "$BIN_DIR/kubectl" \
                && chmod +x "$BIN_DIR/kubectl"
            fi

            fetch https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 "$BIN_DIR/jq" \
              && chmod +x "$BIN_DIR/jq"

            GH_VERSION="2.97.0"
            GH_DIR=$(printf 'gh_%s_linux_amd64' "$GH_VERSION")
            GH_URL=$(printf 'https://github.com/cli/cli/releases/download/v%s/%s.tar.gz' "$GH_VERSION" "$GH_DIR")
            if curl -fsSL "$GH_URL" | tar -xz -C /tmp "$GH_DIR/bin/gh"; then
              mv "/tmp/$GH_DIR/bin/gh" "$BIN_DIR/gh" && chmod +x "$BIN_DIR/gh"
            fi

            if [ -x "$BIN_DIR/kubectl" ] && [ -x "$BIN_DIR/jq" ] && [ -x "$BIN_DIR/gh" ]; then
              touch "$MARKER"
            fi
          fi

          if [ ! -x "$BIN_DIR/gcloud" ]; then
            GCLOUD_VERSION="580.0.0"
            GCLOUD_URL=$(printf 'https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-%s-linux-x86_64.tar.gz' "$GCLOUD_VERSION")
            if fetch "$GCLOUD_URL" /tmp/gcloud.tar.gz; then
              tar -xzf /tmp/gcloud.tar.gz -C /opt/data/.local
              for b in gcloud gsutil bq; do
                ln -sf "/opt/data/.local/google-cloud-sdk/bin/$b" "$BIN_DIR/$b"
              done
              rm -f /tmp/gcloud.tar.gz
            fi
          fi

          if [ ! -x "$BIN_DIR/tofu" ]; then
            TOFU_VERSION="1.12.6"
            TOFU_URL=$(printf 'https://github.com/opentofu/opentofu/releases/download/v%s/tofu_%s_linux_amd64.tar.gz' "$TOFU_VERSION" "$TOFU_VERSION")
            if fetch "$TOFU_URL" /tmp/tofu.tar.gz; then
              tar -xzf /tmp/tofu.tar.gz -C "$BIN_DIR" tofu
              chmod +x "$BIN_DIR/tofu"
              rm -f /tmp/tofu.tar.gz
            fi
          fi

          chown -R 10000:10000 /opt/data/.local
          for b in kubectl jq gh gcloud tofu; do
            [ -x "$BIN_DIR/$b" ] || echo "WARN: $b not installed; will retry on next pod start" >&2
          done
      containers:
      # No `command:` override — keep the image's own ENTRYPOINT (s6 init)
      # intact and only set `args:`, same as upstream's docker-compose.yml.
      # Overriding command bypasses privilege drop / config bootstrap and
      # there's no bare `gateway`/`dashboard` binary to exec directly.
      # One container, not two: HERMES_DASHBOARD=1 makes the image's own s6
      # supervise dashboard alongside gateway-default, sharing one /run/service
      # — required for the dashboard's Start/Stop-gateway control to see
      # gateway at all (it signals a local sibling s6 service, not cross-container).
      - name: gateway
        image: docker.io/nousresearch/hermes-agent
        imagePullPolicy: IfNotPresent
        args: ["gateway", "run"]
        envFrom:
        - secretRef:
            name: hermes-secrets
        - configMapRef:
            name: hermes-config
        env:
        - name: HERMES_DASHBOARD
          value: "1"
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: hermes-dashboard-internal-auth
              key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-dashboard-internal-auth
              key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        ports:
        - containerPort: 8642
          name: gateway
        - containerPort: 9119
          name: dashboard
        volumeMounts:
        - name: data
          mountPath: /opt/data
        resources:
          requests:
            memory: 512Mi
            cpu: 150m
          limits:
            # was 1536Mi; raised after repeated whole-cgroup OOM kills
            memory: 3072Mi
            ## cpu: 1500m
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
