apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      # Off: HERMES_DASHBOARD_PORT auto-injected from the hermes-dashboard
      # Service collides with the app's own env var of the same name.
      enableServiceLinks: false
      imagePullSecrets:
      - name: ghcr-pull-secret
      # Dedicated SA (not "default") bound to the view ClusterRole, so the
      # agent's cluster access is separately named/revocable.
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      initContainers:
      # Tool installation (kubectl, jq, gh, gcloud, tofu) happens in the
      # standalone hermes-tools-install Job (tools-install-job.yaml), not
      # here — that Job owns the network calls, retries independently via
      # backoffLimit, and a broken download there no longer crash-loops the
      # whole gateway+dashboard app. This just blocks until that Job's
      # output shows up on the shared PVC, with no network calls of its own.
      - name: wait-for-tools
        image: busybox
        volumeMounts:
        - name: data
          mountPath: /opt/data
        command: ["sh", "-c"]
        args:
        - |
          set -eu
          BIN_DIR=/opt/data/.local/bin
          for i in $(seq 1 60); do
            if [ -x "$BIN_DIR/kubectl" ] && [ -x "$BIN_DIR/jq" ] && [ -x "$BIN_DIR/gh" ] \
              && [ -x "$BIN_DIR/gcloud" ] && [ -x "$BIN_DIR/tofu" ]; then
              echo "tools present"
              exit 0
            fi
            echo "waiting for hermes-tools-install job to finish ($i/60)..."
            sleep 5
          done
          echo "timed out waiting for tools — check: kubectl -n hermes get jobs,pods -l app=hermes-tools-install" >&2
          exit 1
      containers:
      # No `command:` override — keep the image's own ENTRYPOINT (s6 init)
      # intact and only set `args:`, same as upstream's docker-compose.yml.
      # Overriding command bypasses privilege drop / config bootstrap and
      # there's no bare `gateway`/`dashboard` binary to exec directly.
      # One container, not two: HERMES_DASHBOARD=1 makes the image's own s6
      # supervise dashboard alongside gateway-default, sharing one /run/service
      # — required for the dashboard's Start/Stop-gateway control to see
      # gateway at all (it signals a local sibling s6 service, not cross-container).
      - name: gateway
        image: ghcr.io/hazim1093/hermes-agent
        imagePullPolicy: IfNotPresent
        args: ["gateway", "run"]
        envFrom:
        - secretRef:
            name: hermes-secrets
        - configMapRef:
            name: hermes-config
        env:
        - name: HERMES_DASHBOARD
          value: "1"
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: hermes-dashboard-internal-auth
              key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-dashboard-internal-auth
              key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        ports:
        - containerPort: 8642
          name: gateway
        - containerPort: 9119
          name: dashboard
        volumeMounts:
        - name: data
          mountPath: /opt/data
        resources:
          requests:
            memory: 512Mi
            cpu: 150m
          limits:
            # was 1536Mi; raised after repeated whole-cgroup OOM kills
            memory: 3072Mi
            cpu: 1500m
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
