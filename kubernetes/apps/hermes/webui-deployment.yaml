# Shares the hermes-data PVC (RWO local-path) safely — both pods pin to the same node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: hermes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-webui
  template:
    metadata:
      labels:
        app: hermes-webui
    spec:
      # No default SA token — runs the agent in-process with shell/skill access.
      automountServiceAccountToken: false
      # Populates agent-src below so webui can find hermes-agent (enables
      # webhooks, model auto-detection, etc.) — see docker-compose.two-container.yml
      # in nesquena/hermes-webui upstream.
      initContainers:
      - name: copy-agent-src
        image: ghcr.io/hazim1093/hermes-agent
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "cp -r /opt/hermes/. /agent-src/"]
        volumeMounts:
        - name: agent-src
          mountPath: /agent-src
      containers:
      - name: webui
        image: ghcr.io/nesquena/hermes-webui:0.52.113
        imagePullPolicy: IfNotPresent
        env:
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_WEBUI_HOST
          value: "0.0.0.0"
        - name: HERMES_WEBUI_PORT
          value: "8787"
        - name: HERMES_WEBUI_STATE_DIR
          value: /opt/data/webui
        # No longer same pod as the gateway — reach it over the Service.
        - name: HERMES_API_URL
          value: http://hermes-gateway.hermes.svc.cluster.local:8642
        - name: WANTED_UID
          value: "10000"
        - name: WANTED_GID
          value: "10000"
        - name: HERMES_WEBUI_GATEWAY_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: API_SERVER_KEY
        - name: HERMES_WEBUI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-webui-auth
              key: HERMES_WEBUI_PASSWORD
        ports:
        - containerPort: 8787
          name: webui
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: agent-src
          mountPath: /opt/hermes
          readOnly: true
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: 500m
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
      - name: agent-src
        emptyDir: {}
