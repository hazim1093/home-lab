apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-restrict-ingress
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Same namespace (gateway<->dashboard, and anything else in hermes)
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes
    # hermes-workspace talks to the hermes GATEWAY over ClusterDNS.
    # Gateway-only: the workspace can only authenticate to the dashboard
    # when dashboard auth is disabled, and ours is gated. Restrict to 8642,
    # which it authenticates to via HERMES_API_TOKEN.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes-workspace
      ports:
      - port: 8642
    # Traefik proxies hermes.${LOCAL_DOMAIN} / hermes-api.${LOCAL_DOMAIN} here
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    # Gatus health-checks hermes-gateway/hermes-dashboard directly
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gatus
