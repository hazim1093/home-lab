apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-restrict-ingress
  namespace: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    # Same namespace (gateway<->dashboard, and anything else in hermes)
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes
    # hermes-workspace talks to the hermes GATEWAY over ClusterDNS.
    # Gateway-only: the workspace can only authenticate to the dashboard
    # when dashboard auth is disabled, and ours is gated. Restrict to 8642,
    # which it authenticates to via HERMES_API_TOKEN.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hermes-workspace
      ports:
      - port: 8642
    # Traefik proxies hermes.${LOCAL_DOMAIN} / hermes-api.${LOCAL_DOMAIN} here
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    # Gatus health-checks hermes-gateway/hermes-dashboard directly
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gatus
  egress:
  # Allow DNS (needed to resolve model provider hostnames)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow the Kubernetes API: kubectl from the agent authenticates with the
  # in-pod SA token. The ClusterIP 10.43.0.1:443 DNATs to kube-apiserver on the
  # node at 6443, so both the service range (443) and the node range (6443)
  # must be allowed - 6443 is not covered by the 80/443 rule below.
  - to:
    - ipBlock:
        cidr: 10.43.0.0/16
    - ipBlock:
        cidr: 192.168.0.0/16
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  # Allow HTTP/HTTPS to external model providers and services
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  # Allow traffic within the cluster (other services)
  - to:
    - namespaceSelector: {}
