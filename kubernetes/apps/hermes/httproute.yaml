apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-dashboard
  namespace: hermes
  annotations:
    homarr.dev/enabled: "true"
    homarr.dev/category: "Homelab Apps"
    homarr.dev/name: "Hermes"
    homarr.dev/url: "https://hermes.${LOCAL_DOMAIN}"
    # Homarr rejects app.create without an icon, so this is required for the tile.
    homarr.dev/icon: "https://github.com/NousResearch.png"
    homarr.dev/ping-url: "http://hermes-dashboard.hermes.svc.cluster.local:9119"
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "hermes.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hermes-dashboard
      port: 9119
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-gateway
  namespace: hermes
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: websecure
  hostnames:
  - "hermes-api.${LOCAL_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hermes-gateway
      port: 8642
