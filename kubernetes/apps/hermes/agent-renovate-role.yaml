apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-agent
  namespace: renovate
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-agent
  namespace: renovate
subjects:
- kind: ServiceAccount
  name: hermes-agent
  namespace: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-agent
