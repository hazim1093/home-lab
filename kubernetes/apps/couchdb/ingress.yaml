apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: couchdb
  namespace: couchdb
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: couchdb-svc-couchdb
      port:
        number: 5984
  # The tailnet hostname comes from tls.hosts[0], not from a rule host.
  tls:
    - hosts:
        - couchdb
