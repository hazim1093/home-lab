apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-vault-data
  namespace: obsidian
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # livesync-cli's own db, separate from the plaintext vault restic backs up.
  name: obsidian-livesync-db
  namespace: obsidian
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
