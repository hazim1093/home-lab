---
- name: Setup Raspberry Pi for Zigbee2MQTT
  hosts: raspberry_pi
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose
          - python3-pip
        state: present

    - name: Install Docker Python library
      pip:
        name: docker
        state: present

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Enable and start Docker service
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Create zigbee2mqtt directory
      file:
        path: /opt/zigbee2mqtt
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Create zigbee2mqtt data directory
      file:
        path: /opt/zigbee2mqtt/data
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Deploy zigbee2mqtt configuration
      template:
        src: ../zigbee2mqtt/configuration.yaml
        dest: /opt/zigbee2mqtt/data/configuration.yaml
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Deploy docker-compose file
      template:
        src: ../docker-compose.yml
        dest: /opt/zigbee2mqtt/docker-compose.yml
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Start zigbee2mqtt with docker-compose
      community.docker.docker_compose:
        project_src: /opt/zigbee2mqtt
        state: present
        pull: yes

    - name: Enable docker-compose service on boot
      copy:
        dest: /etc/systemd/system/zigbee2mqtt.service
        content: |
          [Unit]
          Description=Zigbee2MQTT
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/zigbee2mqtt
          ExecStart=/usr/bin/docker-compose up -d
          ExecStop=/usr/bin/docker-compose down

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Enable zigbee2mqtt service
      systemd:
        name: zigbee2mqtt
        enabled: yes
        daemon_reload: yes
