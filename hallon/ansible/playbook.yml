---
- name: Bootstrap Python on Raspberry Pi
  hosts: raspberry_pi
  gather_facts: false
  become: true
  tasks:
    - name: Check if Python3 is installed
      raw: which python3
      register: python_check
      ignore_errors: true
      changed_when: false

    - name: Install Python3 if not present
      raw: apt-get update && apt-get install -y python3 python3-apt
      when: python_check.rc != 0

- name: Setup Raspberry Pi for Zigbee2MQTT
  hosts: raspberry_pi
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Check if Docker is already installed
      command: docker --version
      register: docker_installed
      ignore_errors: true
      changed_when: false

    - name: Install Docker if not present
      apt:
        name:
          - docker.io
        state: present
      when: docker_installed.rc != 0

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Enable and start Docker service
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Create zigbee2mqtt directory
      file:
        path: /opt/zigbee2mqtt
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Create zigbee2mqtt data directory
      file:
        path: /opt/zigbee2mqtt/data
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Deploy zigbee2mqtt configuration
      template:
        src: ../zigbee2mqtt/configuration.yaml
        dest: /opt/zigbee2mqtt/data/configuration.yaml
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Deploy docker-compose file
      template:
        src: ../docker-compose.yml
        dest: /opt/zigbee2mqtt/docker-compose.yml
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Start zigbee2mqtt with docker-compose
      community.docker.docker_compose_v2:
        project_src: /opt/zigbee2mqtt
        state: present
        pull: always

    - name: Enable docker-compose service on boot
      copy:
        dest: /etc/systemd/system/zigbee2mqtt.service
        content: |
          [Unit]
          Description=Zigbee2MQTT
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=true
          WorkingDirectory=/opt/zigbee2mqtt
          ExecStart=/usr/bin/docker compose up -d
          ExecStop=/usr/bin/docker compose down

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Enable zigbee2mqtt service
      systemd:
        name: zigbee2mqtt
        enabled: true
        daemon_reload: true
