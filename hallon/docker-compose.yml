version: '3.8'

services:
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:{{ zigbee2mqtt_version }}
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - {{ zigbee_device }}:{{ zigbee_device }}
    environment:
      - TZ={{ timezone }}
    ports:
      # Frontend port
      - "8080:8080"
