# Zigbee2MQTT configuration
# Home Assistant integration available at: http://<your-home-assistant>:8123

homeassistant:
  enabled: true

# MQTT broker connection
mqtt:
  server: mqtt://{{ mosquitto_host }}:{{ mosquitto_port }}
  base_topic: zigbee2mqtt
  # Optional: MQTT authentication
  # user: mqtt_user
  # password: mqtt_password

# Serial port configuration for ConBee
serial:
  port: {{ zigbee_device }}
  adapter: deconz

# Frontend configuration
frontend:
  port: 8080
  host: 0.0.0.0

# Advanced settings
advanced:
  log_level: info
  pan_id: GENERATE
  network_key: GENERATE
  channel: 11

# Device options
device_options:
  retain: true

# Join is enabled on-demand via the frontend/MQTT, not permanently open
permit_join: false

# Pin friendly names so they survive Z2M migrations (2.14 upgrade wiped the names DB)
devices:
  "0x00178801082645a3":
    friendly_name: Philips Hue 1
  "0x0017880106b22a9d":
    friendly_name: Philips Hue 2
  "0x0017880108088569":
    friendly_name: Philips Dimmer 1
  "0xa4c13853dddb2a11":
    friendly_name: Soil Sensor

